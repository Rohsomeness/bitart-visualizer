<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#2a2438" />
  <meta name="description" content="Bitart Visualizer — retro 80s pixel music visualizer. Capture system audio or mic and pick a vibe." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bitart Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232a2438'/%3E%3Crect x='2' y='10' width='2' height='4' fill='%23ff8fab'/%3E%3Crect x='5' y='6' width='2' height='8' fill='%237ec8e3'/%3E%3Crect x='8' y='3' width='2' height='11' fill='%23ffd36a'/%3E%3Crect x='11' y='8' width='2' height='6' fill='%23ff8fab'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="app" id="app">
    <div class="stage" id="stage">
      <canvas id="viz" aria-label="Music visualizer"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="idle-hint" id="idleHint">
        <div class="idle-pixel">♬</div>
        <p class="idle-title">BITART VISUALIZER</p>
        <p class="idle-sub">tap LISTEN to capture system audio</p>
      </div>
    </div>

    <div class="player" id="player" role="region" aria-label="Bitart visualizer player">
      <div class="player-bezel">
        <header class="player-header" id="playerDrag">
          <div class="brand" id="dragHandle">
            <span class="brand-dot" id="brandDot"></span>
            <span class="brand-name">BITART</span>
            <span class="brand-sub">VIZ</span>
          </div>
          <div class="lcd" id="lcd" aria-live="polite">
            <div class="lcd-row">
              <span class="lcd-label">MODE</span>
              <span class="lcd-value" id="lcdMode">BARS</span>
            </div>
            <div class="lcd-row">
              <span class="lcd-label">STATUS</span>
              <span class="lcd-value lcd-blink" id="lcdStatus">READY</span>
            </div>
            <div class="eq" id="eq" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
          <button type="button" class="btn btn-chip btn-hide" id="btnHide" aria-label="Hide player" title="Hide player (H)">▾</button>
        </header>

        <div class="scene-scroll">
          <button type="button" class="btn btn-chip scene-nav" id="btnScenePrev" aria-label="Scroll modes left">‹</button>
          <div class="scene-rail" id="sceneRail" role="tablist" aria-label="Visualizer modes" tabindex="0">
            <!-- filled by JS -->
          </div>
          <button type="button" class="btn btn-chip scene-nav" id="btnSceneNext" aria-label="Scroll modes right">›</button>
          <button type="button" class="btn btn-chip scene-nav scene-expand" id="btnSceneGrid" aria-label="Show all modes" title="All modes">▦</button>
        </div>

        <div class="controls">
          <button type="button" class="btn btn-round btn-prev" id="btnPrev" aria-label="Previous mode" title="Previous">
            <span class="btn-face">◀</span>
          </button>
          <button type="button" class="btn btn-play" id="btnListen" aria-label="Start or stop listening" title="Listen">
            <span class="btn-face" id="listenIcon">▶</span>
          </button>
          <button type="button" class="btn btn-round btn-next" id="btnNext" aria-label="Next mode" title="Next">
            <span class="btn-face">▶</span>
          </button>
        </div>

        <div class="sliders">
          <label class="slider-block">
            <span class="slider-label">SENS</span>
            <input type="range" id="sensSlider" min="20" max="200" value="100" aria-label="Sensitivity" />
            <span class="slider-val" id="sensVal">100</span>
          </label>
          <div class="toggle-row">
            <button type="button" class="btn btn-chip" id="btnMic" aria-pressed="false" title="Also listen via mic">🎙</button>
            <button type="button" class="btn btn-chip" id="btnFs" title="Fullscreen">⛶</button>
          </div>
        </div>

        <footer class="player-footer">
          <span class="hint">Space listen · ← → modes · F fullscreen · H hide · M mic</span>
          <span class="hint-mobile">Space listen · ▦ all modes · H hide</span>
        </footer>
      </div>
    </div>
  </div>

  <button type="button" class="player-peek" id="btnShow" aria-label="Show player" title="Show player (H)">
    <span class="peek-dot"></span>
    <span class="peek-label">BITART</span>
    <span class="peek-chevron">▴</span>
  </button>

  <div class="scene-modal" id="sceneModal" hidden aria-hidden="true">
    <div class="scene-modal-backdrop" id="sceneModalBackdrop"></div>
    <div class="scene-modal-card" role="dialog" aria-modal="true" aria-labelledby="sceneModalTitle">
      <header class="scene-modal-header">
        <div>
          <h2 id="sceneModalTitle">All Modes</h2>
          <p class="scene-modal-sub">pick a vibe · <span id="sceneModalCount">0</span> total</p>
        </div>
        <button type="button" class="btn btn-chip scene-modal-close" id="btnSceneModalClose" aria-label="Close">✕</button>
      </header>
      <div class="scene-modal-grid" id="sceneModalGrid" role="listbox" aria-label="Visualizer library">
        <!-- filled by JS -->
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/visualizers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
